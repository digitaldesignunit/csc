[pytest]
testpaths = tests
markers =
    slow: expensive tests (headless Rhino, a migration on a dump, fits on real PLYs, > ~5 s); skipped by default, run by `invoke test-release` or `pytest -m ""`
# slow tests stay out of the everyday run; `-m ""` (or `invoke test-release`) brings them back
addopts = -m "not slow"
# a coplanar point set has zero volume: trimesh divides by it on purpose-built test input (frame, descriptors)
filterwarnings =
    ignore:invalid value encountered in divide:RuntimeWarning:trimesh.triangles
