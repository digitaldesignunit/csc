# Geometry Runner Cronjob: derives frame, shape class, proxies, descriptors,
# complexity and previews of every snapshot whose derivation is stale
# Runs every 5 minutes, at most 25 snapshots per run; --sweep also deletes
# the previews and deviation maps of snapshots that no longer exist (8.121:
# only here, where the folders are the ones the database describes)
MAILTO="<maintainer email>"
*/5 * * * * source /home/ddu/.bash_profile && flock -n /tmp/geometry.lock /home/ddu/csc/current/venv/bin/python /home/ddu/csc/current/backend/main_geometry.py --limit 25 --sweep >> /home/ddu/csc/shared/logs/geometry_cronjob.log 2>&1
