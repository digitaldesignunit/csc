# Geometry Runner Cronjob: derives frame, shape class, proxies, descriptors,
# complexity and previews of every snapshot whose derivation is stale
# Runs every 5 minutes, at most 25 snapshots per run
MAILTO="<maintainer email>"
*/5 * * * * source /home/ddu/.bash_profile && flock -n /tmp/geometry.lock /home/ddu/csc/current/venv/bin/python /home/ddu/csc/current/backend/main_geometry.py --limit 25 >> /home/ddu/csc/shared/logs/geometry_cronjob.log 2>&1
