<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Catalog of Second Chances - maintenance</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #5b6475;
    --border: #dde3ef;
    --accent: #4080ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #171e2e;
      --text: #e6eaf2;
      --muted: #a3acbd;
      --border: #2a3448;
      --accent: #7aa5ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 34rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 8px;
    padding: 28px;
  }
  .name {
    margin: 0 0 4px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 { margin: 0 0 16px; font-size: 1.6rem; color: var(--accent); }
  p { margin: 0 0 12px; }
  .small { font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="name">Catalog of Second Chances</p>
  <h1>Maintenance, back soon</h1>
{{MESSAGE}}
{{END}}
{{CONTACT}}
</main>
</body>
</html>
