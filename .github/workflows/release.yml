name: Release

# Push a tag v<version> (matching VERSION) on main:
#   CI -> build the three bundles -> GitHub Release -> deploy (needs approval)

on:
  push:
    tags: ['v*']

# read only; the one job that writes (the release itself) asks for more
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # a called workflow gets at most the caller's permissions; ci.yml's
    # `changes` job reads pull requests (path filter, decision 8.114)
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/ci/check_version.py --tag "$GITHUB_REF_NAME"
          # Zenodo archives the tagged commit with its .zenodo.json
          python scripts/ci/zenodo_metadata.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Frontend build
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_STATIC_BASE_URL: ${{ vars.NEXT_PUBLIC_STATIC_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          v="${{ steps.meta.outputs.version }}"
          for part in backend frontend gh; do
            bash scripts/ci/package_release.sh "$part" "$v" dist
          done
          (cd dist && sha256sum csc-* > SHA256SUMS && cat SHA256SUMS)
          python scripts/ci/release_notes.py "$v" > dist/NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creates the GitHub Release and uploads the bundles
      id-token: write      # the keyless signature of the attestation (Sigstore)
      attestations: write  # stores the attestation (decision 8.153)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist
      # every release asset gets a provenance attestation; the deploy script
      # verifies the backend tar and the frontend zip with `gh attestation verify`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/csc-backend-*.tar.gz
            dist/csc-frontend-*.zip
            dist/csc-gh-interface-*.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CSC ${{ needs.build.outputs.version }}
          body_path: dist/NOTES.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            dist/csc-backend-*.tar.gz
            dist/csc-frontend-*.zip
            dist/csc-gh-interface-*.zip
            dist/SHA256SUMS

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      command: deploy ${{ github.ref_name }}
    secrets: inherit
