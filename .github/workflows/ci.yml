name: CI

# Guards what goes live (decision 8.114): pull requests to main, every release
# (release.yml calls this workflow) and manual runs. No run per push. tests/ci
# runs in the versions job, which never skips. The wider
# suite (tests/catalog, tests/grasshopper, slow tests) runs locally:
# `invoke test-all`, and `invoke test-release` before tagging.
#
# On a pull request the frontend and backend jobs run only when their paths
# changed; a release and a manual run always run every job. A skipped job
# counts as passed for a required check.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'src/backend/**'
              - 'tests/api/**'
              - 'tests/conftest.py'
              - 'requirements-dev.txt'
              - 'pytest.ini'
            frontend:
              - 'src/frontend/**'
      - id: result
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python scripts/ci/check_version.py
      # .zenodo.json carries the version and its CHANGELOG section
      - run: python scripts/ci/zenodo_metadata.py --check
      # the release and workflow checks (action pins, release permissions,
      # zenodo metadata): stdlib only, seconds; this job runs on every pull
      # request, so a workflow or Dependabot change is checked too
      - run: pip install pytest
      - run: python -m pytest tests/ci -q -p no:cacheprovider

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13 (TCMalloc and rseq,
    # SERVER-121912), and ubuntu-latest runs such a kernel; ubuntu-22.04 runs 6.8.
    # Back to ubuntu-latest once its kernel is 7.0.14 or newer.
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CSC_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/backend/requirements.txt
            src/backend/constraints.txt
      - run: pip install -r requirements-dev.txt
      # the route tests only (decision 8.114); every xdist worker gets its own
      # database on the service container
      - run: python -m pytest tests/api -q -n auto
      - name: Backend installs on Uberspace 7 without compiling
        run: python -m invoke check-server-wheels

  deploy-script:
    name: Deploy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning uberspaceconfig/deployment/*.sh scripts/ci/*.sh
      - run: bash scripts/ci/test_release_deploy.sh
      - run: bash scripts/ci/test_maintenance.sh
      - run: bash scripts/ci/test_package_gh.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  grasshopper:
    name: Grasshopper sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Sources compile
        run: python -m compileall -q grasshopper_userobjects_src
      - name: Changed sources are versioned and re-exported
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref_type }}" = tag ]; then
            base="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          else
            base="${{ github.event.before }}"
          fi
          python scripts/ci/check_gh_sources.py --base "${base:-HEAD}"
