name: Grasshopper Folder Release

on:
  push:
    paths:
      - 'grasshopper_release/**'
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write  # required for release creation

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Parse version from interface filename
        id: version
        run: |
          set -euo pipefail

          mapfile -t interface_files < <(
            find grasshopper_release -maxdepth 1 -type f \
              -name 'DDU_CSC_GrasshopperInterface_*.gh' \
              ! -name '*_Example_*' \
              | sort
          )

          if [ ${#interface_files[@]} -eq 0 ]; then
            echo "ERROR: No interface file found in grasshopper_release/"
            echo "Expected: DDU_CSC_GrasshopperInterface_<version>.gh"
            echo "Example:  DDU_CSC_GrasshopperInterface_0.5.0.0-beta-9.gh"
            exit 1
          fi

          echo "Found interface file(s):"
          printf '  %s\n' "${interface_files[@]}"

          best_file=""
          best_version=""

          for gh_file in "${interface_files[@]}"; do
            filename=$(basename "$gh_file" .gh)
            version="${filename#DDU_CSC_GrasshopperInterface_}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+ ]]; then
              echo "Skipping $filename — version does not start with a number"
              continue
            fi

            echo "  Parsed version: $version"

            if [ -z "$best_version" ] || \
               [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -n 1)" = "$version" ]; then
              best_version="$version"
              best_file="$gh_file"
            fi
          done

          if [ -z "$best_version" ]; then
            echo "ERROR: Could not parse a version from interface filename(s)"
            exit 1
          fi

          new_version="gh-interface-${best_version}"
          release_name="DDU CSC GrasshopperInterface ${new_version}"
          zip_name="ddu-csc-grasshopper-interface-${new_version}.zip"

          echo "Selected file: $(basename "$best_file")"
          echo "Final version: $new_version"

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Prepare and zip the release folder
        run: |
          set -euo pipefail
          shopt -s nullglob

          display_name="DDU CSC GrasshopperInterface ${{ steps.version.outputs.new_version }}"
          mkdir "$display_name"

          example_files=(grasshopper_release/DDU_CSC_GrasshopperInterface_Example_*)
          if [ ${#example_files[@]} -eq 0 ]; then
            echo "ERROR: No example files found in grasshopper_release/"
            echo "Expected files like DDU_CSC_GrasshopperInterface_Example_01.gh"
            exit 1
          fi

          echo "Including example files (interface file is excluded):"
          printf '  %s\n' "${example_files[@]}"
          cp "${example_files[@]}" "$display_name/"

          cp -r grasshopper_userobjects "$display_name/UserObjects"
          cp README.md "$display_name/"
          cp LICENSE "$display_name/"

          zip -r "${{ steps.version.outputs.zip_name }}" "$display_name"
          rm -rf "$display_name"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.release_name }}
          files: ${{ steps.version.outputs.zip_name }}
          body: |
            ### Release Notes
            New Release of the DDU CSC GrasshopperInterface
